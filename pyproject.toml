[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysradb"
dynamic = ["version"]
description = "A Python package for interacting with SRAdb and downloading datasets from SRA/ENA/GEO"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{ name = "Saket Choudhary", email = "saketkc@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "lxml>=4.6.3",
    "pandas>=1.3.2",
    "requests>=2.26.0",
    "rich>=10.0.0",
    "tqdm>=4.62.1",
    "xmltodict>=0.12.0",
]

[project.optional-dependencies]
enrichment = ["instructor>=1.0.0", "pydantic>=2.0.0", "sentence-transformers>=2.0.0"]
docs = [
    "sphinx>=4.0",
    "furo>=2023.0.0",
    "sphinx-tabs>=3.4.1",
    "numpydoc>=1.5.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.18.0",
    "ipython>=7.0",
    "sphinxcontrib-gtagjs>=0.2",
    "sphinx-panels>=0.5.2",
]
all = [
    "pysradb[enrichment,docs]",
]

[project.scripts]
pysradb = "pysradb.cli:parse_args"

[project.urls]
Homepage = "https://saket-choudhary.me/pysradb"

[tool.hatch.version]
path = "pysradb/__init__.py"
